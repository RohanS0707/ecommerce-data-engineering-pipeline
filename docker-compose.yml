services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20
  pipeline:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev
      DATA_DIR: /app/data
      SPARK_MASTER: local[*]
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "src.pipeline"]
volumes:
  pgdata:

